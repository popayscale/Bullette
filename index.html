<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>💥 Bulles à éclater !</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#06142d;color:#fff;font-family:Arial,Helvetica,sans-serif}
body{touch-action:manipulation}
button{font:inherit;border:0;color:#fff;cursor:pointer}
#app{width:100vw;height:100dvh;min-height:100vh;position:relative;overflow:hidden;
background:radial-gradient(circle at 50% 35%,#123c73 0,#071c3d 42%,#020b1d 100%)}
#app:before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.25;
background-image:radial-gradient(#fff 1px,transparent 1px);background-size:42px 42px}
.screen{position:absolute;inset:0;display:none;z-index:2}
.screen.active{display:flex}
#menu{align-items:center;justify-content:center;flex-direction:column;padding:20px;overflow:auto}
.logo{font-size:clamp(38px,9vw,86px);font-weight:1000;letter-spacing:-3px;text-align:center;
text-shadow:0 6px 0 #12345f,0 9px 22px #000;margin:0 0 8px}
.logo span:nth-child(1){color:#ff4058}.logo span:nth-child(2){color:#ffad22}.logo span:nth-child(3){color:#64df42}.logo span:nth-child(4){color:#45caff}.logo span:nth-child(5){color:#bd65ff}
.subtitle{font-size:clamp(15px,2.5vw,24px);opacity:.85;margin-bottom:25px;text-align:center}
.modes{display:flex;gap:24px;width:min(850px,100%);justify-content:center}
.mode{flex:1;min-width:220px;padding:25px 22px;border-radius:25px;background:rgba(5,25,58,.88);
border:2px solid #1e5a92;box-shadow:0 15px 35px #0008;text-align:center}
.mode .icon{font-size:54px;margin-bottom:5px}.mode h2{margin:5px 0 8px;font-size:clamp(25px,4vw,40px)}
.mode p{min-height:45px;opacity:.8;margin:0 0 18px;font-size:16px}
.play{width:100%;padding:14px 20px;border-radius:15px;font-weight:900;font-size:21px;
background:linear-gradient(#65ef35,#28ad18);box-shadow:inset 0 2px #ffffff66,0 5px 0 #176b12,0 9px 18px #0007}
.chrono .play{background:linear-gradient(#ffc13b,#f07808);box-shadow:inset 0 2px #ffffff66,0 5px 0 #a94a00,0 9px 18px #0007}
.play:active,.topbtn:active{transform:translateY(3px)}
.note{margin-top:22px;opacity:.6;font-size:13px}

#game{flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.hud{height:76px;flex:none;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding:10px max(12px,env(safe-area-inset-right)) 10px max(12px,env(safe-area-inset-left));
background:rgba(2,12,31,.88);backdrop-filter:blur(8px);border-bottom:1px solid #245384;z-index:5}
.hud-left,.hud-right{display:flex;gap:8px;align-items:center}.hud-right{justify-content:flex-end}
.topbtn{padding:11px 14px;border-radius:12px;background:#1474c8;font-size:14px;font-weight:900;box-shadow:0 4px 0 #094577}
.restart{background:#e33b45;box-shadow:0 4px 0 #8e1820}
.stat{text-align:center;min-width:105px}.stat small{display:block;font-weight:900;font-size:11px;opacity:.75;letter-spacing:1px}
.stat strong{font-size:25px;color:#ffe23b}.time strong{color:#6eff53}.time.danger strong{color:#ff4b4b}
#board{position:relative;flex:1;min-height:0;overflow:hidden;user-select:none}
.bubble{position:absolute;border-radius:50%;transform:translate(-50%,-50%);cursor:pointer;
box-shadow:inset -9px -12px 15px #0004,inset 8px 8px 10px #fff6,0 5px 12px #0008;
transition:transform .08s ease}
.bubble:after{content:"";position:absolute;width:28%;height:18%;left:18%;top:14%;border-radius:50%;background:#fff9;transform:rotate(-25deg)}
.bubble.pop{animation:pop .18s ease-out forwards;pointer-events:none}
@keyframes pop{to{transform:translate(-50%,-50%) scale(1.8);opacity:0}}
.float{position:absolute;pointer-events:none;font-size:24px;font-weight:1000;text-shadow:0 2px 5px #000;animation:float .65s ease-out forwards;z-index:4}
@keyframes float{to{transform:translateY(-55px);opacity:0}}
#end{align-items:center;justify-content:center;flex-direction:column;background:#020a19dd;backdrop-filter:blur(8px);padding:20px;text-align:center}
.endbox{width:min(480px,92vw);background:#0a2349;border:2px solid #2870aa;border-radius:25px;padding:30px;box-shadow:0 20px 50px #000}
.endbox h1{margin:0 0 10px;font-size:38px}.finalscore{font-size:58px;font-weight:1000;color:#ffe13b;margin:10px}
.endbuttons{display:flex;gap:12px;margin-top:22px}.endbuttons button{flex:1;padding:14px;border-radius:13px;font-weight:900}
.again{background:#29b51c}.home{background:#1677c8}

@media(max-width:650px){
 .modes{flex-direction:column;gap:14px;max-width:430px}.mode{padding:16px 18px}.mode p{min-height:0;margin-bottom:12px}
 .logo{font-size:clamp(38px,12vw,60px)}
 .hud{height:64px;padding:7px 8px}.topbtn{font-size:11px;padding:9px 9px}.stat{min-width:65px}.stat strong{font-size:20px}.stat small{font-size:9px}
}
@media(max-height:500px) and (orientation:landscape){
 #menu{padding:8px}.logo{font-size:38px;margin:0}.subtitle{margin:0 0 8px}.modes{gap:12px}.mode{padding:10px 15px}.mode .icon{font-size:30px}.mode h2{font-size:22px}.mode p{font-size:12px;margin:0 0 7px}.play{padding:8px;font-size:16px}.note{display:none}
}
</style>
</head>
<body>
<div id="app">
<section id="menu" class="screen active">
  <h1 class="logo"><span>B</span><span>U</span><span>L</span><span>L</span><span>E</span><span>S</span><br>À ÉCLATER !</h1>
  <div class="subtitle">Éclate les bulles le plus vite possible 💥</div>
  <div class="modes">
    <div class="mode">
      <div class="icon">♾️</div><h2>ILLIMITÉ</h2>
      <p>Joue sans limite et bats ton meilleur score.</p>
      <button class="play" onclick="startGame('free')">JOUER</button>
    </div>
    <div class="mode chrono">
      <div class="icon">⏱️</div><h2>CHRONO</h2>
      <p>1 minute pour éclater un maximum de bulles !</p>
      <button class="play" onclick="startGame('chrono')">JOUER</button>
    </div>
  </div>
  <div class="note">💡 Compatible PC, tablette et mobile • portrait & paysage</div>
</section>

<section id="game" class="screen">
 <div class="hud">
  <div class="hud-left"><button class="topbtn" onclick="quitGame()">◀ QUITTER</button></div>
  <div class="stat"><small>SCORE</small><strong id="score">0</strong></div>
  <div class="hud-right">
   <div class="stat time" id="timerBox"><small id="timeLabel">TEMPS</small><strong id="timer">∞</strong></div>
   <button class="topbtn restart" onclick="restartGame()">↻ RECOMMENCER</button>
  </div>
 </div>
 <div id="board"></div>
</section>

<section id="end" class="screen">
 <div class="endbox">
  <h1 id="endTitle">Temps écoulé !</h1>
  <div>TON SCORE</div><div class="finalscore" id="finalScore">0</div>
  <div id="bestText"></div>
  <div class="endbuttons">
   <button class="again" onclick="restartGame()">↻ REJOUER</button>
   <button class="home" onclick="quitGame()">⌂ MENU</button>
  </div>
 </div>
</section>
</div>

<script>
const colors=['#ff3f55','#ffb21e','#55d52e','#24a9ff','#a94cff','#ff4ec8','#19d8d2'];
let mode='free',score=0,timeLeft=60,timerId=null,spawnId=null,running=false;
let bestFree=Number(localStorage.getItem('bubbleBestFree')||0);
let bestChrono=Number(localStorage.getItem('bubbleBestChrono')||0);
const board=document.getElementById('board');

function fullscreen(){
  const el=document.documentElement;
  if(!document.fullscreenElement && el.requestFullscreen) el.requestFullscreen().catch(()=>{});
}
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active')}

function startGame(m){
 fullscreen(); mode=m; score=0; timeLeft=60; running=true;
 document.getElementById('score').textContent='0';
 document.getElementById('timer').textContent=m==='chrono'?'01:00':'∞';
 document.getElementById('timerBox').classList.remove('danger');
 document.getElementById('timeLabel').textContent=m==='chrono'?'TEMPS':'MODE';
 show('game'); board.innerHTML='';
 fillBoard();
 clearInterval(timerId); clearInterval(spawnId);
 spawnId=setInterval(()=>{if(running) addBubble()},m==='chrono'?430:520);
 if(m==='chrono'){
  timerId=setInterval(()=>{
   timeLeft--; updateTimer();
   if(timeLeft<=0) endGame();
  },1000);
 }
}
function restartGame(){startGame(mode)}
function updateTimer(){
 const s=Math.max(0,timeLeft), text='00:'+String(s).padStart(2,'0');
 document.getElementById('timer').textContent=text;
 document.getElementById('timerBox').classList.toggle('danger',s<=10);
}
function fillBoard(){
 const n=window.innerWidth<600?18:28;
 for(let i=0;i<n;i++) addBubble();
}
function addBubble(){
 if(!running)return;
 const b=document.createElement('div'); b.className='bubble';
 const size=Math.max(28,Math.min(68,Math.min(innerWidth,innerHeight)*0.075));
 const d=size*(.78+Math.random()*.42); b.style.width=d+'px';b.style.height=d+'px';
 b.style.left=(3+Math.random()*94)+'%';b.style.top=(5+Math.random()*88)+'%';
 b.style.background=colors[Math.floor(Math.random()*colors.length)];
 b.addEventListener('pointerdown',e=>{e.preventDefault();popBubble(b,e.clientX,e.clientY)}, {passive:false});
 board.appendChild(b);
}
function popBubble(b,x,y){
 if(!running || b.classList.contains('pop'))return;
 b.classList.add('pop'); score++; document.getElementById('score').textContent=score;
 const f=document.createElement('div');f.className='float';f.textContent='+1';f.style.left=x+'px';f.style.top=y+'px';
 document.body.appendChild(f);setTimeout(()=>f.remove(),700);
 setTimeout(()=>b.remove(),180);
}
function endGame(){
 if(!running)return; running=false; clearInterval(timerId);clearInterval(spawnId);
 board.querySelectorAll('.bubble').forEach(b=>b.remove());
 document.getElementById('finalScore').textContent=score;
 document.getElementById('endTitle').textContent=mode==='chrono'?'⏱️ Temps écoulé !':'🎉 Partie terminée !';
 const best=mode==='chrono'?bestChrono:bestFree;
 if(score>best){
   if(mode==='chrono')bestChrono=score;else bestFree=score;
   localStorage.setItem(mode==='chrono'?'bubbleBestChrono':'bubbleBestFree',score);
   document.getElementById('bestText').textContent='🏆 NOUVEAU RECORD !';
 }else document.getElementById('bestText').textContent='Meilleur score : '+best;
 show('end');
}
function quitGame(){
 running=false;clearInterval(timerId);clearInterval(spawnId);board.innerHTML='';
 show('menu');
}
document.addEventListener('keydown',e=>{
 if(e.key==='Escape' && running) quitGame();
 if((e.key==='r'||e.key==='R') && running) restartGame();
});
window.addEventListener('resize',()=>{if(running){ /* Le plateau reste fluide sans recalculer les bulles. */ }});
</script>
</body>
</html>
